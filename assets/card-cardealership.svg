<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img" aria-label="Car Dealership: Dealership website with a clean browsing layout" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1036"/><stop offset="1" stop-color="#2b1a5c"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c" stop-opacity=".95"/><stop offset="1" stop-color="#6d3fc9"/></linearGradient>
<clipPath id="cl"><rect width="380" height="200" rx="20"/></clipPath>
<style>
.bl{animation:bl 8s ease-in-out infinite alternate}@keyframes bl{to{transform:translate(-50px,-30px)}}
.sh{animation:sh 4s linear infinite;animation-delay:2.4s}@keyframes sh{to{stroke-dashoffset:-100}}
.fi{animation:fi 3.6s ease-in-out infinite;animation-delay:1.6s}@keyframes fi{50%{transform:translateY(-4px)}}
.ar{animation:ar 1.4s ease-in-out infinite}@keyframes ar{50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="380" height="200" rx="20" fill="url(#bg)"/>
<g clip-path="url(#cl)"><circle class="bl" cx="340" cy="190" r="100" fill="#fb923c" fill-opacity=".13"/></g>
<rect x="1" y="1" width="378" height="198" rx="19" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
<rect class="sh" x="1" y="1" width="378" height="198" rx="19" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86"/>
<rect x="24" y="22" width="54" height="54" rx="15" fill="url(#ic)"/>
<text class="fi" x="51" y="59" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="28">🚗</text>
<text x="92" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="17.5" fill="#fff">Car Dealership</text>
<text x="92" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#fb923c">Website</text>
<circle cx="348" cy="40" r="16" fill="none" stroke="#fb923c" stroke-opacity=".6" stroke-width="1.5"/>
<path class="ar" d="M342 46 L354 34 M346 34 H354 V42" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="104" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d3c8f7">Dealership website with a clean browsing</text><text x="24" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d3c8f7">layout</text><rect x="24" y="152" width="49" height="26" rx="13" fill="#fb923c" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".5"/><text x="49" y="169" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#fb923c">HTML</text><rect x="81.2" y="152" width="42" height="26" rx="13" fill="#fb923c" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".5"/><text x="102" y="169" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#fb923c">CSS</text></svg>