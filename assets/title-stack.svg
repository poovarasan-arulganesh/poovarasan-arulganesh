<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 84" width="600" height="84" role="img" aria-label="Tech Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#7c3aed"/><stop offset=".3" stop-color="#a78bfa"/><stop offset=".5" stop-color="#e879f9"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<style>
.tt{animation:in 1s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.dm{transform-box:fill-box;transform-origin:center;animation:sp 3s ease-in-out infinite}@keyframes sp{0%,100%{transform:rotate(45deg) scale(.8)}50%{transform:rotate(225deg) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<text class="tt" x="300" y="52" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="36" fill="url(#sh)">Tech Stack</text>
<g class="dm" style="animation-delay:0s"><rect x="170" y="31" width="14" height="14" rx="3" fill="url(#sh)"/></g><g class="dm" style="animation-delay:1.5s"><rect x="416" y="31" width="14" height="14" rx="3" fill="url(#sh)"/></g>
<rect x="300" y="66" width="0" height="4" rx="2" fill="url(#ln)">
<animate attributeName="width" values="40;195;40" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1" keyTimes="0;.5;1"/>
<animate attributeName="x" values="280;202;280" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1" keyTimes="0;.5;1"/></rect>
</svg>